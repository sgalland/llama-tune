name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: llama-tune-windows-x86_64.exe
            built_name: llama-tune.exe
          - os: ubuntu-latest
            asset_name: llama-tune-linux-x86_64
            built_name: llama-tune
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: llama-tune-macos-arm64
            built_name: llama-tune
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: llama-tune-macos-x86_64
            built_name: llama-tune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
            echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          fi

      - name: Stage binary
        shell: bash
        run: cp "$BIN_DIR/${{ matrix.built_name }}" ${{ matrix.asset_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset_name }}
